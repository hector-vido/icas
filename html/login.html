<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>ICAS - {{ .title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css"/>
</head>
<body>
<div class="page">
    <div class="page-wrapper">
        <div class="page-header d-print-none">
            <div class="container-xl">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <h2 class="page-title">ICAS - {{ .title }}</h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="page-body">
            <div class="container-xl">
                <div class="row row-cards justify-content-center">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <form method="post" id="login-form">
                                    <div class="mb-3">
                                        <label class="form-label" for="email">Email</label>
                                        <input type="email" class="form-control" id="email"
                                               placeholder="email@example.com" required/>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" for="password">Senha</label>
                                        <input type="password" class="form-control" id="password" required/>
                                    </div>
                                    <label class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox"/>
                                        <span class="form-check-label">Continuar logado</span>
                                    </label>
                                    <div class="mb3">
                                        <button type="submit" class="btn btn-primary" id="login-button">Entrar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="row justify-content-center mt-2">
                        <div class="col-md-6">
                            <div class="alert alert-success" role="alert" id="login-success" style="display: none">
                                <div class="alert-icon">
                                    <!-- Download SVG icon from http://tabler.io/icons/icon/check -->
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                         stroke-linejoin="round" aria-hidden="true" focusable="false"
                                         class="icon alert-icon">
                                        <path d="M5 12l5 5l10 -10"/>
                                    </svg>
                                </div>
                                <div><h3 class="alert-heading">Usuário encontrado!</h3>
                                    <div class="alert-description">Carregando os tamanduás monitorados...</div>
                                </div>
                            </div>
                            <div class="alert alert-danger" role="alert" id="login-error" style="display: none">
                                <div class="alert-icon">
                                    <!-- Download SVG icon from http://tabler.io/icons/icon/alert-circle -->
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                         stroke-linejoin="round" aria-hidden="true" focusable="false"
                                         class="icon alert-icon">
                                        <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/>
                                        <path d="M12 8v4"/>
                                        <path d="M12 16h.01"/>
                                    </svg>
                                </div>
                                <div><h3 class="alert-heading">Ops&hellip;</h3>
                                    <div class="alert-description" id="login-error-message">Usuário ou senha inválidos.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="/static/main.js"></script>
</body>
</html>
